# Set evaluasi Career Assistant (Tugas A.3).
#
# v1.1 (19 Okt 2026): ejaan Indonesia ikut dihitung (ID 12 "Data Analis", Jakarta, tanpa gaji).
# Total data analyst Jakarta 16 -> 17. Run lama dinilai ulang dengan: run_eval --rescore <file.json>
# v1.2 (20 Okt 2026): T14 pengecualian lokasi ("selain/di luar Jakarta"), dari bug uji manual UI.
#      T14-01 diberi sql_values (Tangerang, Banten = 28): dengan answer_any saja, jawaban RAG
#      berisi 5 lowongan acak di luar Jakarta ikut lulus (run b31-planner).
#
# KEPUTUSAN REQUIREMENT (berlaku untuk semua kasus):
# R1 Rentang gaji = BERIRISAN. "gaji 5-8 jt" -> salary_min <= 8000000 AND salary_max >= 5000000.
#    "di atas X" -> salary_max > X. "di bawah X" -> salary_min < X. "5jt-an" -> rentang 5.000.000-5.999.999.
#    salary_max tidak pernah NULL bila salary_min terisi (dicek 17 Okt 2026), jadi tidak perlu COALESCE.
# R2 "Rata-rata gaji" = rata-rata salary_min DAN salary_max, plus jumlah lowongan bergaji dari total.
# R3 Tanya balik HANYA jika tidak ada posisi, bidang, maupun kota DAN riwayat kosong. Selain itu tebak terbaik.
# R4 Perbandingan yang bisa dijawab satu query (GROUP BY) = SATU sub-tugas SQL, tidak dipecah.
# R5 Saat memfilter gaji, lowongan tanpa gaji cukup disebut jumlahnya, tidak didaftar.
# R6 Maksimal 3 sub-tugas. Sisanya disebut dan pengguna diminta bertanya terpisah.
# R7 Pencocokan posisi: lower(job_title) LIKE '%frasa%' (pola SQL agent), ejaan Indonesia dan Inggris
#    sama-sama dihitung (analyst/analis, design/desain). Kota: lower(location) LIKE '%kota%'.
# R8 Pengecualian lokasi: "selain X", "di luar X", "kecuali X" -> lower(location) NOT LIKE '%x%'.
#    "Di mana saja ..." = sebaran lokasi (SQL GROUP BY location), bukan pencarian RAG.
#
# FORMAT KASUS
# id, category (T1a..T13), question, history (opsional, format st.session_state, TANPA pertanyaan saat ini)
# expected.response : answer | clarify | refuse | out_of_scope | unsupported
# expected.agents   : agent per sub-tugas, urutan tidak dinilai ([] = tanpa agent)
# expected.agents_alt: (opsional) alternatif yang juga dianggap benar
# expected.subtasks : deskripsi sub-tugas untuk manusia
# criteria          : kriteria lulus dalam kalimat (untuk review manual)
# checks            : kriteria otomatis, SEMUA harus lulus
#   sql_values : daftar gold SQL. Setiap sel angka non-NULL hasilnya wajib muncul di jawaban
#                (angka di jawaban dinormalisasi: Rp6.812.500 -> 6812500; toleransi 1%).
#   sql_ids    : gold SQL berkolom id. Himpunan ID yang dikutip [ID:x] dari sub-tugas SQL == hasil gold.
#   rag        : daftar grup {title_any | desc_any, location_any?, location_none?, min_ids}. Tiap grup
#                dipenuhi minimal min_ids ID yang dikutip; setiap ID dari RAG wajib cocok dengan minimal
#                satu grup. location_none: lokasi lowongan TIDAK boleh memuat frasa mana pun.
#   no_ids     : true -> jawaban tidak mengutip ID apa pun.
#   answer_any : minimal satu frasa muncul di jawaban (case-insensitive).
#   answer_none: tidak satu pun frasa muncul di jawaban.
#   no_rupiah  : true -> jawaban tidak memuat angka Rupiah (tidak menebak gaji).
#   standalone_any / standalone_none : untuk pertanyaan lanjutan, dicek pada gabungan pertanyaan mandiri.
#
# METRIK (dicatat runner, bukan kriteria lulus per kasus)
# rute benar (multiset agent == expected), semua bagian terjawab (checks lulus), sitasi valid
# (ID dikutip subset kandidat/hasil query), panggilan LLM, token, latensi.
# Batas panggilan LLM: planner 1 + per sub-tugas (SQL <= 3, RAG <= 1) + sintesis <= 1 jika sub-tugas > 1.
# Kasus tanpa agent: <= 1.

version: "1.2"

cases:
  # --- T1a: tunggal SQL, statistik ------------------------------------------
  - id: T1a-01
    category: T1a
    question: Berapa rata-rata gaji data analyst di Jakarta?
    expected:
      response: answer
      agents: [sql]
      subtasks: [rata-rata gaji min & maks data analyst Jakarta]
    criteria: Rata-rata gaji min Rp6.812.500 dan maks Rp8.625.000; disebut 4 dari 17 lowongan bergaji.
    checks:
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'

  - id: T1a-02
    category: T1a
    question: Berapa jumlah lowongan di Surabaya?
    expected:
      response: answer
      agents: [sql]
      subtasks: [hitung lowongan Surabaya]
    criteria: 18 lowongan.
    checks:
      sql_values:
        - SELECT COUNT(*) FROM jobs WHERE lower(location) LIKE '%surabaya%'

  - id: T1a-03
    category: T1a
    question: Perusahaan mana yang paling banyak membuka lowongan?
    expected:
      response: answer
      agents: [sql]
      subtasks: [peringkat perusahaan berdasarkan jumlah lowongan]
    criteria: >
      Teratas "Pengiklan Anonim" (18) dan dijelaskan bahwa itu pengiklan tanpa nama, bukan satu
      perusahaan; perusahaan bernama teratas PT Trinusa Travelindo (5).
    checks:
      answer_any: [Trinusa]
      sql_values:
        - SELECT COUNT(*) FROM jobs WHERE company_name = 'Pengiklan Anonim'

  - id: T1a-04
    category: T1a
    question: Berapa jumlah lowongan per tipe kerja?
    expected:
      response: answer
      agents: [sql]
      subtasks: [hitung per work_type]
    criteria: Full time 407, Kontrak/Temporer 62, Paruh waktu 2, Kasual 2.
    checks:
      sql_values:
        - SELECT work_type, COUNT(*) FROM jobs GROUP BY work_type

  - id: T1a-05
    category: T1a
    question: Lowongan dengan gaji tertinggi di data kalian apa?
    expected:
      response: answer
      agents: [sql]
      subtasks: [lowongan dengan salary_max tertinggi]
    criteria: "[ID:473] Investment Associate - RGF HR Agent Indonesia, Rp28.000.000-Rp35.000.000."
    checks:
      sql_ids:
        - SELECT id FROM jobs WHERE salary_max = (SELECT MAX(salary_max) FROM jobs)
      sql_values:
        - SELECT MAX(salary_max) FROM jobs

  # --- T1b: tunggal SQL, daftar dengan filter angka --------------------------
  - id: T1b-01
    category: T1b
    question: Lowongan data analyst di Jakarta dengan gaji 5 sampai 8 juta
    expected:
      response: answer
      agents: [sql]
      subtasks: [daftar DA Jakarta, rentang gaji beririsan 5-8 jt]
    criteria: Kartu ID 10, 14, 28, 56; disebut 13 lowongan lain tidak mencantumkan gaji.
    checks:
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'
            AND salary_min <= 8000000 AND salary_max >= 5000000
      sql_values:
        - |
          SELECT COUNT(*) - COUNT(salary_min) FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'

  - id: T1b-02
    category: T1b
    question: Lowongan di Surabaya yang gajinya di atas 10 juta
    expected:
      response: answer
      agents: [sql]
      subtasks: [daftar Surabaya, salary_max > 10 jt]
    criteria: Kartu ID 94 (Sales, 13-18 jt) dan 466 (Senior Finance & Investment Manager, 9-12 jt).
    checks:
      sql_ids:
        - SELECT id FROM jobs WHERE lower(location) LIKE '%surabaya%' AND salary_max > 10000000

  - id: T1b-03
    category: T1b
    question: Lowongan full time di Bogor yang mencantumkan gaji
    expected:
      response: answer
      agents: [sql]
      subtasks: [daftar Bogor, Full time, salary_min tidak NULL]
    criteria: Kartu ID 54, 124, 365, 393.
    checks:
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE lower(location) LIKE '%bogor%' AND work_type = 'Full time' AND salary_min IS NOT NULL

  # --- T2: tunggal RAG -------------------------------------------------------
  - id: T2-01
    category: T2
    question: Saya lulusan akuntansi, lowongan apa yang cocok?
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari lowongan bidang akuntansi/keuangan]
    criteria: 1-5 kartu bidang akuntansi/keuangan dengan alasan; tidak ada lowongan di luar bidang.
    checks:
      rag:
        - title_any: [account, akunt, finance, financial, keuangan, tax, pajak, audit]
          min_ids: 1

  - id: T2-02
    category: T2
    question: Lowongan yang membutuhkan skill Python
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari lowongan dengan Python di deskripsi]
    criteria: Semua kartu memuat Python di deskripsi.
    checks:
      rag:
        - desc_any: [python]
          min_ids: 1

  - id: T2-03
    category: T2
    question: Lowongan graphic designer di Bandung
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari graphic designer Bandung]
    criteria: Kartu ID 223 dan/atau 263; tidak ada lowongan di luar Bandung.
    checks:
      rag:
        - title_any: [graphic, design, desain]
          location_any: [bandung]
          min_ids: 1

  - id: T2-04
    category: T2
    question: Lowongan social media specialist di Jakarta
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari social media Jakarta]
    criteria: 1-5 kartu social media di Jakarta (data punya 13).
    checks:
      rag:
        - title_any: [social media]
          location_any: [jakarta]
          min_ids: 1

  # --- T3: majemuk SQL+SQL ---------------------------------------------------
  - id: T3-01
    category: T3
    note: Pertanyaan persis dari screenshot temuan mentor (typo dibiarkan).
    question: >-
      berapa rata-rata gaji data analys yang ada di Jakarta. apakah ada lowongan yang sesuai jika
      saya ingin mencari lowongan data analis dengan range gaji 5jt sampai 8 jt? berikan lowongannya?
    expected:
      response: answer
      agents: [sql, sql]
      subtasks:
        - rata-rata gaji min & maks data analyst Jakarta
        - daftar DA Jakarta, rentang gaji beririsan 5-8 jt
    criteria: >
      Rata-rata min Rp6.812.500 dan maks Rp8.625.000 (4 dari 17 bergaji), LALU kartu ID 10, 14, 28, 56,
      dan disebut 13 lowongan tanpa data gaji.
    checks:
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'
            AND salary_min <= 8000000 AND salary_max >= 5000000

  - id: T3-02
    category: T3
    question: Berapa jumlah lowongan marketing di Tangerang, dan mana saja yang gajinya di atas 8 juta?
    expected:
      response: answer
      agents: [sql, sql]
      subtasks: [hitung marketing Tangerang, daftar marketing Tangerang salary_max > 8 jt]
    criteria: 14 lowongan; kartu ID 114, 120, 168, 221.
    checks:
      sql_values:
        - |
          SELECT COUNT(*) FROM jobs
          WHERE lower(job_title) LIKE '%marketing%' AND lower(location) LIKE '%tangerang%'
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE lower(job_title) LIKE '%marketing%' AND lower(location) LIKE '%tangerang%'
            AND salary_max > 8000000

  - id: T3-03
    category: T3
    question: Ada berapa lowongan digital marketing di Jakarta? Tampilkan juga 3 yang gajinya paling tinggi.
    expected:
      response: answer
      agents: [sql, sql]
      subtasks: [hitung digital marketing Jakarta, 3 teratas berdasarkan salary_max]
    criteria: 30 lowongan; kartu ID 203, 216, 219 (ketiganya maks Rp15.000.000).
    checks:
      sql_values:
        - |
          SELECT COUNT(*) FROM jobs
          WHERE lower(job_title) LIKE '%digital marketing%' AND lower(location) LIKE '%jakarta%'
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE lower(job_title) LIKE '%digital marketing%' AND lower(location) LIKE '%jakarta%'
            AND salary_max IS NOT NULL
          ORDER BY salary_max DESC LIMIT 3

  # --- T4: majemuk SQL+RAG ---------------------------------------------------
  - id: T4-01
    category: T4
    question: Berapa jumlah lowongan di Bandung, dan mana yang cocok untuk desainer grafis?
    expected:
      response: answer
      agents: [sql, rag]
      subtasks: [hitung lowongan Bandung, cari desain grafis Bandung]
    criteria: 10 lowongan; kartu desain grafis di Bandung (ID 223/263).
    checks:
      sql_values:
        - SELECT COUNT(*) FROM jobs WHERE lower(location) LIKE '%bandung%'
      rag:
        - title_any: [graphic, design, desain]
          location_any: [bandung]
          min_ids: 1

  - id: T4-02
    category: T4
    question: Rata-rata gaji software engineer berapa? Lalu carikan lowongan yang butuh Python.
    expected:
      response: answer
      agents: [sql, rag]
      subtasks: [rata-rata gaji software engineer, cari lowongan Python]
    criteria: Min Rp8.935.714 dan maks Rp12.107.143 (7 dari 17 bergaji); kartu dengan Python di deskripsi.
    checks:
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs WHERE lower(job_title) LIKE '%software engineer%'
      rag:
        - desc_any: [python]
          min_ids: 1

  - id: T4-03
    category: T4
    question: Berapa lowongan social media di Medan dan berapa rata-rata gajinya? Lalu carikan lowongan data analyst di Jakarta.
    expected:
      response: answer
      agents: [sql, rag]
      subtasks: [hitung + rata-rata gaji social media Medan (satu query), cari DA Jakarta]
    criteria: 3 lowongan, min Rp3.152.333 & maks Rp4.000.000 (3 dari 3); kartu DA Jakarta.
    checks:
      sql_values:
        - |
          SELECT COUNT(*), AVG(salary_min), AVG(salary_max) FROM jobs
          WHERE lower(job_title) LIKE '%social media%' AND lower(location) LIKE '%medan%'
      rag:
        - title_any: [data analy, data analis]
          location_any: [jakarta]
          min_ids: 1

  # --- T5: majemuk RAG+RAG ---------------------------------------------------
  - id: T5-01
    category: T5
    question: Carikan lowongan graphic designer dan lowongan social media di Jakarta
    expected:
      response: answer
      agents: [rag, rag]
      subtasks: [cari graphic designer Jakarta, cari social media Jakarta]
    criteria: Dua kelompok kartu, keduanya di Jakarta; tidak ada ID ganda.
    checks:
      rag:
        - title_any: [graphic, design, desain]
          location_any: [jakarta]
          min_ids: 1
        - title_any: [social media]
          location_any: [jakarta]
          min_ids: 1

  - id: T5-02
    category: T5
    question: Saya bisa desain dan juga paham data. Carikan lowongan desain grafis dan lowongan data analyst di Jakarta.
    expected:
      response: answer
      agents: [rag, rag]
      subtasks: [cari desain grafis Jakarta, cari DA Jakarta]
    criteria: Dua kelompok kartu di Jakarta.
    checks:
      rag:
        - title_any: [graphic, design, desain]
          location_any: [jakarta]
          min_ids: 1
        - title_any: [data analy, data analis]
          location_any: [jakarta]
          min_ids: 1

  # --- T6a: lanjutan, ganti konteks ------------------------------------------
  - id: T6a-01
    category: T6a
    history:
      - {role: user, content: "Lowongan data analyst di Jakarta"}
      - {role: assistant, content: "Ada 3 lowongan data analyst di Jakarta: ..."}
    question: Kalau yang di Surabaya?
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari DA Surabaya]
    criteria: Pertanyaan mandiri memuat data analyst + Surabaya, tanpa Jakarta; kartu ID 3 (Data Analyst Supervisor, Surabaya).
    checks:
      standalone_any: [data analyst]
      standalone_none: [jakarta]
      rag:
        - title_any: [data analy, data analis]
          location_any: [surabaya]
          min_ids: 1

  - id: T6a-02
    category: T6a
    history:
      - {role: user, content: "Berapa jumlah lowongan di Bandung?"}
      - {role: assistant, content: "Ada 10 lowongan di Bandung."}
    question: Rata-rata gajinya berapa?
    expected:
      response: answer
      agents: [sql]
      subtasks: [rata-rata gaji Bandung]
    criteria: Min & maks rata-rata Bandung, 4 dari 10 bergaji.
    checks:
      standalone_any: [bandung]
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs WHERE lower(location) LIKE '%bandung%'

  - id: T6a-03
    category: T6a
    history:
      - {role: user, content: "Lowongan graphic designer di Bandung"}
      - {role: assistant, content: "Ada 2 lowongan graphic designer di Bandung: ..."}
    question: Kalau di Jakarta ada juga?
    expected:
      response: answer
      agents: [rag]
      subtasks: [cari graphic designer Jakarta]
    criteria: Pertanyaan mandiri memuat design + Jakarta, tanpa Bandung.
    checks:
      standalone_any: [design, desain]
      standalone_none: [bandung]
      rag:
        - title_any: [graphic, design, desain]
          location_any: [jakarta]
          min_ids: 1

  - id: T6a-04
    category: T6a
    history:
      - {role: user, content: "Berapa jumlah lowongan di Bandung?"}
      - {role: assistant, content: "Ada 10 lowongan di Bandung."}
    question: Berapa total semua lowongan yang ada di database?
    expected:
      response: answer
      agents: [sql]
      subtasks: [hitung semua lowongan]
    criteria: 473; konteks Bandung TIDAK ditempel.
    checks:
      standalone_none: [bandung]
      sql_values:
        - SELECT COUNT(*) FROM jobs

  - id: T6a-05
    category: T6a
    history:
      - {role: user, content: "Berapa rata-rata gaji data analyst di Jakarta?"}
      - {role: assistant, content: "Rata-rata gaji minimum Rp6.812.500 dan maksimum Rp8.625.000 (4 dari 16 lowongan punya data gaji)."}
    question: Kalau di Bogor berapa, dan tampilkan lowongannya yang ada gajinya
    expected:
      response: answer
      agents: [sql, sql]
      agents_alt: [[sql]]
      subtasks: [rata-rata gaji DA Bogor, daftar DA Bogor bergaji]
    criteria: Rata-rata Bogor min Rp4.280.000 & maks Rp5.000.000 (1 dari 2 bergaji); kartu ID 54.
    checks:
      standalone_any: [bogor]
      standalone_none: [jakarta]
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%bogor%'
      sql_ids:
        - |
          SELECT id FROM jobs
          WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%bogor%'
            AND salary_min IS NOT NULL

  # --- T6b: lanjutan, merujuk lowongan di jawaban sebelumnya -----------------
  - id: T6b-01
    category: T6b
    note: Menguji pemotongan riwayat (MAX_HISTORY_CHARS=300); Pandurasa ada setelah karakter ke-300.
    history:
      - {role: user, content: "Lowongan data analyst di Jakarta dengan gaji 5 sampai 8 juta"}
      - role: assistant
        content: |-
          Ada 4 lowongan data analyst di Jakarta dengan rentang gaji yang masuk 5-8 juta:
          - [ID:10] Data Analyst - PT ACCENTUATES (Jakarta Raya): Rp6.000.000-Rp7.000.000
          - [ID:14] Data Analyst - Pengiklan Anonim (Jakarta Selatan, Jakarta Raya (Hibrid)): Rp6.750.000-Rp9.500.000
          - [ID:28] Data Analyst Consultant - PT Sodexo Sinergi Indonesia (Jakarta Raya): Rp7.500.000-Rp10.000.000
          - [ID:56] MARKET DATA ANALYST - PT Pandurasa Kharisma (Jakarta Raya): Rp7.000.000-Rp8.000.000
          12 lowongan lain tidak mencantumkan gaji.
    question: Yang dari Pandurasa itu tipe kerjanya apa?
    expected:
      response: answer
      agents: [sql]
      subtasks: [detail lowongan ID 56]
    criteria: Menjawab ID 56 (PT Pandurasa Kharisma), tipe kerja dari data.
    checks:
      standalone_any: ["56", pandurasa]
      sql_ids:
        - SELECT id FROM jobs WHERE id = 56

  - id: T6b-02
    category: T6b
    history:
      - {role: user, content: "Lowongan data analyst di Jakarta"}
      - role: assistant
        content: |-
          Berikut lowongan data analyst di Jakarta yang sesuai:
          - [ID:10] Data Analyst - PT ACCENTUATES (Jakarta Raya): sesuai posisi dan lokasi.
          - [ID:14] Data Analyst - Pengiklan Anonim (Jakarta Selatan, Jakarta Raya (Hibrid)): sesuai posisi dan lokasi.
    question: Yang kedua gajinya berapa?
    expected:
      response: answer
      agents: [sql]
      subtasks: [gaji lowongan ID 14]
    criteria: Rp6.750.000-Rp9.500.000 untuk ID 14.
    checks:
      standalone_any: ["14"]
      sql_values:
        - SELECT salary_min, salary_max FROM jobs WHERE id = 14

  # --- T7: perbandingan ------------------------------------------------------
  - id: T7-01
    category: T7
    question: Bandingkan gaji data analyst di Jakarta dan Surabaya
    expected:
      response: answer
      agents: [sql]
      subtasks: [rata-rata gaji DA per kota, GROUP BY]
    criteria: >
      Jakarta min Rp6.812.500 / maks Rp8.625.000 (4 dari 17); Surabaya 1 lowongan tanpa data gaji,
      jadi tidak bisa dibandingkan. Tidak menebak gaji Surabaya.
    checks:
      answer_any: [tidak ada data gaji, tidak mencantumkan gaji, tidak ada informasi gaji, belum ada data gaji]
      sql_values:
        - |
          SELECT AVG(salary_min), AVG(salary_max), COUNT(salary_min), COUNT(*)
          FROM jobs WHERE (lower(job_title) LIKE '%data analyst%' OR lower(job_title) LIKE '%data analis%') AND lower(location) LIKE '%jakarta%'

  - id: T7-02
    category: T7
    question: Lebih banyak lowongan di Bandung atau di Surabaya?
    expected:
      response: answer
      agents: [sql]
      subtasks: [hitung per kota, GROUP BY]
    criteria: Surabaya 18, Bandung 10.
    checks:
      sql_values:
        - SELECT COUNT(*) FROM jobs WHERE lower(location) LIKE '%surabaya%'
        - SELECT COUNT(*) FROM jobs WHERE lower(location) LIKE '%bandung%'

  # --- T8: ambigu / kurang info ----------------------------------------------
  - id: T8-01
    category: T8
    question: Ada lowongan?
    expected:
      response: clarify
      agents: []
      subtasks: []
    criteria: Bertanya balik posisi/bidang/kota dengan contoh; tidak ada kartu.
    checks:
      no_ids: true

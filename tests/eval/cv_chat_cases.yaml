# Set eval Asisten Karier dengan CV aktif (make eval-cv-chat).
#
# v1.0. Profil dan kandidat lowongan cv01..cv05 dibaca dari fixture di field profiles (diambil
# dari satu run make eval-cv); hasil Cocokkan CV dibangun ulang dari kandidat itu tanpa
# embedding (run_cv_chat_eval.py).
# Posisi tujuan: cv01 Data Analyst, cv02 Graphic Designer, cv03 HR Generalist,
# cv04 Sales & Marketing Executive, cv05 Financial Analyst.
#
# KEPUTUSAN (berlaku untuk semua kasus):
# K1 Profil dipakai hanya jika pengguna merujuk dirinya ("untukku", "CV-ku", "posisi yang kutuju").
#    Pertanyaan lain dikerjakan persis seperti tanpa CV (standalone_none: posisi tujuan).
# K2 "Yang cocok untukku" tanpa syarat lain -> cv_match. Permintaan lowongan umum tanpa posisi,
#    bidang, kota, atau ID ("Ada info kerjaan?") juga cv_match: profil memberi konteks.
# K3 "Yang cocok untukku" + kota/pengecualian kota -> rag; + gaji -> sql. Posisi tujuan dari
#    profil wajib ada di pertanyaan mandiri (standalone_all).
# K4 "Skill apa yang kurang/perlu dipelajari" -> cv_gap.
# K5 Isi jawaban SQL/RAG tidak dinilai di set ini (tugas make eval); yang dinilai rute,
#    respons, isi jawaban agent CV, sitasi, dan pertanyaan mandiri.
# K6 (v1.1) Posisi tujuan di pertanyaan mandiri ditulis tanpa tingkat jabatan (Executive, Staff,
#    Officer, Senior, Junior): SQL mencocokkan judul kata per kata, dan "Sales & Marketing
#    Executive" hanya cocok dengan 1 lowongan bergaji di atas 8 juta, "sales"/"marketing" 24.
#    Run lama dinilai ulang dengan: run_cv_chat_eval --rescore <file.json>
# K7 (v1.2) Permintaan saran, strategi, atau langkah untuk diri pengguna ("bagaimana agar cepat
#    dapat kerja dengan CV ini") -> cv_match + cv_gap, bukan out_of_scope: jawabannya dari data
#    (lowongan paling cocok dan skill yang perlu ditambah), tanpa LLM tambahan.
# K8 (v1.3) Pindah atau naik ke posisi/bidang lain yang disebut pengguna -> cv_role: skill gap
#    dan lowongan teratas dihitung untuk posisi itu, bukan untuk posisi tujuan di CV.
#    cv_match/cv_gap di sini menampilkan lowongan posisi lama yang tidak ditanyakan.
# K9 (v1.3) Kata "saya" dalam permintaan lowongan atau statistik berposisi jelas ("carikan saya
#    lowongan akuntan") bukan permintaan hasil Cocokkan CV: tanpa cv_match/cv_gap, tanpa posisi
#    tujuan dari profil. Pertanyaan skill pasar tanpa rujukan diri, posisi, atau kota dijawab
#    skill_stats (v1.6): statistik skill seluruh lowongan, dipilih tanpa planner.
# K10 (v1.3) Ingin pindah karier tanpa menyebut bidang tujuan -> out_of_scope (balasan
#    menanyakan bidang tujuan), bukan lowongan posisi lama.
# K11 (v1.5) "Yang paling cocok" di samping posisi dan kota ("gaji DA Jakarta + 1 yang paling
#    cocok"): rag berposisi dan berkota paling tepat, tetapi cv_match juga diterima. Planner
#    memilih cv_match di 7 dari 7 run, juga dengan aturan prompt khusus yang menurunkan C12-02,
#    dan pertanyaan pengguna tidak cukup untuk menyusun pertanyaan rag tanpa LLM. Menyaring
#    hasil Cocokkan CV per posisi dan kota belum ada.
# K12 (v1.6) Pertanyaan lanjutan tentang asal data jawaban ("referensi/sumber informasi ini
#    dari mana") -> data_source: pesan tetap tentang data lowongan aplikasi, tanpa planner.
# K13 (v1.7) Detail atau deskripsi tepat satu ID lowongan -> job_detail: lowongan dibaca dari
#    SQLite tanpa planner dan tanpa LLM, juga tanpa CV. Lewat planner dan SQL, generator SQL
#    membalas TIDAK_RELEVAN (8 dari 8 run) dan planner tanpa CV membalas refuse (4 dari 4 run).
#    Pesan yang isinya persis judul lowongan ("General Ledger Specialist") -> rag untuk judul
#    itu tanpa planner; lewat planner jawabannya out_of_scope atau cv_role (0 dari 8 run benar).
#    Setelah jawaban yang menampilkan lowongan berjudul sama, sql dengan ID-nya juga sah.
#
# FORMAT KASUS
# id, category, cv (cv01..cv05, atau null = tanpa CV), question, history (opsional)
# profile (opsional): field profil yang menimpa fixture CV, mis. target_role dengan dua posisi
# expected.response : answer | clarify | refuse | out_of_scope | unsupported (default answer)
# expected.agents   : agent per sub-tugas, urutan tidak dinilai; agents_alt: alternatif yang sah
# expected.response_alt: jenis respons lain yang sah
# expected.report_only: true -> hanya dicetak, tidak dihitung lulus/gagal
# checks.standalone_all : daftar grup frasa; tiap grup minimal satu frasa ada di pertanyaan mandiri
# checks.standalone_none: tidak satu pun frasa ada di pertanyaan mandiri
# Cek otomatis tanpa ditulis: cv_match -> ID = 5 teratas; cv_gap -> 3 skill kurang teratas
# ada di jawaban; semua ID yang dikutip berasal dari sub-hasil agent.
version: "1.7"
profiles: tests/eval/cv_chat_profiles.json
cases:
  # --- C1: lowongan yang cocok dengan CV (K2) ---------------------------------
  - id: C1-01
    category: C1
    cv: cv01
    question: Dari CV-ku, posisi apa yang paling pas buat dilamar?
    expected: {agents: [cv_match]}

  - id: C1-02
    category: C1
    cv: cv02
    question: Ada lowongan yang pas buat saya?
    expected: {agents: [cv_match]}

  - id: C1-03
    category: C1
    cv: cv03
    question: Berdasarkan CV saya, kerjaan apa yang cocok?
    expected: {agents: [cv_match]}

  - id: C1-04
    category: C1
    cv: cv04
    question: rekomendasiin loker sesuai profilku dong
    expected: {agents: [cv_match]}

  - id: C1-05
    category: C1
    cv: cv05
    question: Lowongan apa yang cocok untuk saya?
    expected: {agents: [cv_match]}

  # --- C2: skill yang kurang (K4) ---------------------------------------------
  - id: C2-01
    category: C2
    cv: cv01
    question: Sebaiknya aku belajar skill apa dulu?
    expected: {agents: [cv_gap]}

  - id: C2-02
    category: C2
    cv: cv02
    question: Apa saja skill yang masih kurang di CV saya?
    expected: {agents: [cv_gap]}

  - id: C2-03
    category: C2
    cv: cv03
    question: Biar peluangku lebih besar, skill apa yang harus ditambah?
    expected: {agents: [cv_gap]}

  - id: C2-04
    category: C2
    cv: cv04
    question: skill apa yg kurang dari cv ku
    expected: {agents: [cv_gap]}

  - id: C2-05
    category: C2
    cv: cv05
    question: Skill apa yang paling sering diminta tapi belum saya punya?
    expected: {agents: [cv_gap]}

  # --- C3: cocok untukku + kota -> rag dengan posisi tujuan (K3) ---------------
  - id: C3-01
    category: C3
    cv: cv01
    question: Yang cocok untukku di Jakarta ada?
    expected: {agents: [rag]}
    checks:
      standalone_all: [[data analyst, data analis, analis data], [jakarta]]

  - id: C3-02
    category: C3
    cv: cv02
    question: Ada lowongan buat aku di Bandung?
    expected: {agents: [rag]}
    checks:
      standalone_all: [[graphic design, desain grafis, desainer grafis], [bandung]]

  - id: C3-03
    category: C3
    cv: cv03
    question: Lowongan yang sesuai CV-ku di Surabaya
    expected: {agents: [rag]}
    checks:
      standalone_all: [[hr, human resource, sdm, personalia], [surabaya]]

  - id: C3-04
    category: C3
    cv: cv04
    question: Kalau di Bekasi ada yang cocok buat saya?
    expected: {agents: [rag]}
    checks:
      standalone_all: [[sales, marketing, pemasaran], [bekasi]]
      standalone_none: [executive]

  - id: C3-05
    category: C3
    cv: cv05
    question: Lowongan untuk saya di luar Jakarta
    expected: {agents: [rag]}
    checks:
      standalone_all:
        - [financial, finance, keuangan]
        - [di luar jakarta, selain jakarta, kecuali jakarta]

  # --- C4: statistik untuk posisi tujuan -> sql (K3) --------------------------
  - id: C4-01
    category: C4
    cv: cv01
    question: Berapa rata-rata gaji untuk posisi yang kutuju?
    expected: {agents: [sql]}
    checks:
      standalone_all: [[data analyst, data analis, analis data]]

  - id: C4-02
    category: C4
    cv: cv03
    question: Ada berapa lowongan untuk posisi incaranku?
    expected: {agents: [sql]}
    checks:
      standalone_all: [[hr, human resource, sdm, personalia]]

  - id: C4-03
    category: C4
    cv: cv04
    question: Lowongan untukku yang gajinya di atas 8 juta
    expected: {agents: [sql]}
    checks:
      standalone_all: [[sales, marketing, pemasaran], [8 juta, 8.000.000, "8000000"]]
      standalone_none: [executive]

  - id: C4-04
    category: C4
    cv: cv05
    question: Gaji tertinggi untuk posisi yang saya incar berapa?
    expected: {agents: [sql]}
    checks:
      standalone_all: [[financial, finance, keuangan]]

  # --- C5: tidak merujuk diri -> tanpa profil (K1) ----------------------------
  - id: C5-01
    category: C5
    cv: cv02
    question: Berapa total lowongan di data?
    expected: {agents: [sql]}
    checks:
      standalone_none: [graphic, desain, design]

  - id: C5-02
    category: C5
    cv: cv05
    question: Lowongan barista di Bali
    expected: {agents: [rag]}
    checks:
      standalone_none: [financial, finance, keuangan, analyst]

  - id: C5-03
    category: C5
    cv: cv03
    question: Halo!
    expected: {response: out_of_scope, agents: []}

  - id: C5-04
    category: C5
    cv: cv01
    question: Hapus semua lowongan data analyst
    expected: {response: refuse, agents: []}

  # --- C6: gabungan -------------------------------------------------------------
  - id: C6-01
    category: C6
    cv: cv04
    question: Lowongan yang cocok dengan CV-ku dan skill apa yang kurang?
    expected: {agents: [cv_match, cv_gap]}

  - id: C6-02
    category: C6
    cv: cv01
    question: Tunjukkan lowongan yang cocok buatku, lalu berapa jumlah lowongan data analyst di Jakarta?
    expected: {agents: [cv_match, sql]}

  - id: C6-03
    category: C6
    cv: cv01
    question: gaji DA Jakarta + 1 yang paling cocok
    expected:
      agents: [sql, rag]
      agents_alt: [[sql, cv_match]]
    checks:
      standalone_all: [[data analyst, analis data], [jakarta]]

  # --- C7: lanjutan ---------------------------------------------------------------
  - id: C7-01
    category: C7
    cv: cv02
    history:
      - {role: user, content: "Lowongan yang cocok dengan CV-ku?"}
      - {role: assistant, content: "Dari profilmu (Graphic Designer · 5+ tahun), ini 5 lowongan teratas hasil Cocokkan CV: ..."}
    question: Yang di Jakarta saja
    expected: {agents: [rag]}
    checks:
      standalone_all: [[graphic design, desain grafis, desainer grafis], [jakarta]]

  - id: C7-02
    category: C7
    cv: cv05
    history:
      - {role: user, content: "Skill apa yang kurang dari CV saya?"}
      - {role: assistant, content: "Dari 10 lowongan yang paling cocok dengan CV-mu, skill yang paling sering diminta dan belum ada di CV: ..."}
    question: Kalau lowongan yang cocok buatku?
    expected: {agents: [cv_match]}

  # --- C8: permintaan umum dengan CV aktif -> cv_match (K2) ---------------------
  - id: C8-01
    category: C8
    cv: cv03
    question: Ada info kerjaan?
    expected: {agents: [cv_match]}

  # --- C9: saran atau strategi untuk diri pengguna -> cv_match + cv_gap (K7) -------
  - id: C9-01
    category: C9
    cv: cv01
    question: >-
      menurut anda bagaimana saya agar bisa mendapatkan pekerjaan secara cepat dengan cv yang
      saya punya tersebut?
    expected: {agents: [cv_match, cv_gap]}

  - id: C9-02
    category: C9
    cv: cv02
    question: Apa yang harus saya lakukan agar lamaran saya diterima?
    expected: {agents: [cv_match, cv_gap]}

  - id: C9-03
    category: C9
    cv: cv03
    question: Peluangku dapat kerja seperti apa, dan apa yang perlu kuperbaiki?
    expected: {agents: [cv_match, cv_gap]}

  - id: C9-04
    category: C9
    cv: cv05
    question: Dengan profil ini aku sebaiknya mulai dari mana biar cepat kerja?
    expected: {agents: [cv_match, cv_gap]}

  # --- C10: pindah atau naik ke posisi lain -> cv_role (K8) ----------------------
  - id: C10-01
    category: C10
    cv: cv01
    question: Aku mau pindah karier ke bidang keuangan, apa yang perlu kulakukan dengan CV ini?
    expected: {agents: [cv_role]}
    checks:
      standalone_any: [keuangan, finance]
      standalone_none: [data analyst]

  - id: C10-02
    category: C10
    cv: cv03
    question: saya ingin naik jadi project manager, apa yang harus saya lakukan?
    expected: {agents: [cv_role]}
    checks:
      standalone_any: [project manager]
      answer_any: [project, proyek]

  - id: C10-03
    category: C10
    cv: cv02
    question: Skill apa yang perlu kupelajari untuk menjadi product manager?
    expected: {agents: [cv_role]}
    checks:
      standalone_any: [product manager]
      standalone_none: [graphic, design]

  - id: C10-04
    category: C10
    cv: cv05
    question: Kalau mau beralih jadi data analyst, skill apa yang kurang dari CV saya?
    expected: {agents: [cv_role]}
    checks:
      standalone_any: [data analyst]
      answer_any: [data analyst, analis data]

  - id: C10-05
    category: C10
    cv: cv01
    question: switch ke finance
    expected: {agents: [cv_role]}
    checks:
      standalone_any: [finance, keuangan]
      standalone_none: [data analyst]

  # --- C11: "saya" dalam permintaan berposisi jelas -> tanpa agent CV (K9) ---------
  - id: C11-01
    category: C11
    cv: cv01
    question: carikan saya lowongan kerja tentang akuntan
    expected: {agents: [rag]}
    checks:
      standalone_any: [akuntan, akuntansi, accounting]
      standalone_none: [data analyst]

  - id: C11-02
    category: C11
    cv: cv02
    question: Saya mau lihat lowongan perawat di Medan
    expected: {agents: [rag]}
    checks:
      standalone_all: [[perawat], [medan]]
      standalone_none: [graphic, design, desain]

  - id: C11-03
    category: C11
    cv: cv03
    question: Saya penasaran, berapa rata-rata gaji sales di Jakarta?
    expected: {agents: [sql]}
    checks:
      standalone_all: [[sales], [jakarta]]
      standalone_none: [hr, human resource]

  # --- C12: skill pasar tanpa rujukan diri -> tanpa agent CV (K9) ------------------
  - id: C12-01
    category: C12
    cv: cv03
    question: skill apa yang sangat sering diminta oleh para recruiter?
    expected: {agents: [skill_stats]}
    checks:
      standalone_none: [hr, human resource]

  - id: C12-02
    category: C12
    cv: cv04
    question: Software apa yang paling banyak dicari perusahaan di lowongan?
    expected: {agents: [skill_stats]}
    checks:
      standalone_none: [sales, marketing]

  - id: C12-03
    category: C12
    cv: cv01
    question: skill paling sering diminta recruiter
    expected: {agents: [skill_stats]}
    checks:
      standalone_none: [data analyst]

  - id: C12-04
    category: C12
    cv: cv01
    profile: {target_role: Fullstack Developer dan Data Analyst}
    question: skill paling sering diminta recruiter
    expected: {agents: [skill_stats]}
    checks:
      standalone_none: [fullstack, data analyst]

  # --- C13: pindah karier tanpa bidang tujuan -> out_of_scope (K10) ----------------
  - id: C13-01
    category: C13
    cv: cv01
    question: bagaimana cara saya untuk switch karir
    expected: {response: out_of_scope, agents: []}

  - id: C13-02
    category: C13
    cv: cv04
    question: Aku pengen ganti profesi, enaknya mulai dari mana?
    expected: {response: out_of_scope, agents: []}

  # --- N: pertanyaan tentang CV saat CV belum ada (hanya dilaporkan) -------------
  - id: N-01
    category: N
    cv: null
    question: Dari CV-ku, lowongan mana yang pas?
    expected: {report_only: true, agents: []}

  - id: N-02
    category: N
    cv: null
    question: Skill apa yang kurang dari CV saya?
    expected: {report_only: true, agents: []}

  # --- C14: asal data jawaban (K12) ----------------------------------------------------
  - id: C14-01
    category: C14
    cv: cv02
    history:
      - {role: user, content: "Skill apa yang paling banyak dicari?"}
      - {role: assistant, content: "Skill yang paling sering disebut di 473 lowongan: ..."}
    question: Sumber data jawaban tadi dari mana?
    expected: {agents: [data_source]}

  # --- C15: detail lowongan ber-ID dan nama posisi saja (K13) -------------------------
  - id: C15-01
    category: C15
    cv: cv05
    history:
      - {role: user, content: "saya ingin switch career menjadi accountant, skill apa yang perlu saya pelajari?"}
      - {role: assistant, content: "Untuk posisi Accountant: dari 10 lowongan yang paling mirip dengan posisi itu, skill yang paling sering diminta dan belum ada di CV-mu:\n- Forecasting: 7 dari 10 lowongan (ID 471, 457, 442, 453, 420, 468, 472)\n\nContoh 5 lowongan teratas untuk posisi Accountant:\n- [ID:471] General Ledger Specialist - Pengiklan Anonim (Jakarta Selatan, Jakarta Raya)"}
    question: deskripsi lengkapnya lowongan dengan id 471
    expected: {agents: [job_detail]}
    checks:
      standalone_all: [["471"]]
      answer_any: [General Ledger Specialist]

  - id: C15-02
    category: C15
    cv: cv05
    question: Tampilkan deskripsi lengkap lowongan ID 471
    expected: {agents: [job_detail]}
    checks:
      standalone_all: [["471"]]
      answer_any: [General Ledger Specialist]

  - id: C15-03
    category: C15
    cv: null
    question: Tampilkan deskripsi lengkap lowongan ID 471
    expected: {agents: [job_detail]}
    checks:
      standalone_all: [["471"]]
      answer_any: [General Ledger Specialist]

  - id: C15-04
    category: C15
    cv: cv05
    history:
      - {role: user, content: "saya ingin switch career menjadi accountant, skill apa yang perlu saya pelajari?"}
      - {role: assistant, content: "Untuk posisi Accountant: dari 10 lowongan yang paling mirip dengan posisi itu, skill yang paling sering diminta dan belum ada di CV-mu:\n- Forecasting: 7 dari 10 lowongan (ID 471, 457, 442, 453, 420, 468, 472)\n\nContoh 5 lowongan teratas untuk posisi Accountant:\n- [ID:471] General Ledger Specialist - Pengiklan Anonim (Jakarta Selatan, Jakarta Raya)"}
    question: General Ledger Specialist
    expected: {agents: [rag], agents_alt: [[sql]]}
    checks:
      standalone_any: [general ledger, "471"]

  - id: C15-05
    category: C15
    cv: cv05
    question: General Ledger Specialist
    expected: {agents: [rag]}
    checks:
      standalone_any: [general ledger]

  - id: C15-06
    category: C15
    cv: null
    question: General Ledger Specialist
    expected: {agents: [rag], agents_alt: [[]], response_alt: [clarify]}

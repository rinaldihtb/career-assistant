      education_level: S1
      experiences: 2
      skills:
        - Analisis Keuangan
        - Financial Modeling
        - Budgeting
        - Forecasting
        - Laporan Keuangan (PSAK)
        - Variance Analysis
        - Valuasi (DCF)
        - Microsoft Excel (VBA)
        - Power BI
        - SAP FI/CO
        - Perpajakan (PPh & PPN)
        - Accurate
        - [Inggris, Bahasa Inggris, English]

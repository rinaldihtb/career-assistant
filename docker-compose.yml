services:
  streamlit:
    build: .
    command: streamlit run src/app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      - ASSISTANT_API_URL=http://fastapi:8000
    depends_on:
      - fastapi
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

  fastapi:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

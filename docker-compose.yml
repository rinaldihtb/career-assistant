services:
  streamlit:
    build: .
    command: streamlit run src/app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro

  fastapi:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: python -c "import urllib.request as u; u.urlopen('http://localhost:8000/docs')"
      interval: 10s
      start_period: 30s
